name: Monitor Litoral

on:
  # Parana PAUSADO: se saco el horario automatico. Solo corre a mano si hace falta.
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          sudo apt-get install -y fonts-liberation
          pip install requests beautifulsoup4 Pillow lxml

      - name: Crear config.json
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          python3 -c "
          import json, os
          config = {
            'facebook_page_token': os.environ.get('FACEBOOK_PAGE_TOKEN', ''),
          }
          with open('config.json', 'w') as f:
              json.dump(config, f)
          "

      - name: Correr monitor
        run: python monitor_litoral.py
